name: child-b2-immutable-validation

on:
  push:
    branches:
      - work/8f5f29c4-7c46-4a5b-8d12-0d1e4f6a9c20

permissions:
  contents: read

jobs:
  validate-immutable-head:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable corrected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4c2efe7511a0f00e08574fb1f48ce15bf2e782d1
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable target identity
        run: test "$(git rev-parse HEAD)" = "4c2efe7511a0f00e08574fb1f48ce15bf2e782d1"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Diagnose remaining legacy blob identity
        run: |
          git hash-object continuity/checkpoints/CP-000012-19e5c808.json
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          validator = Path("continuity/tools/validate_checkpoints.py")
          spec = importlib.util.spec_from_file_location("checkpoint_validator_debug", validator)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          path = Path("continuity/checkpoints/CP-000012-19e5c808.json")
          rel = path.as_posix()
          print("HELPER_SHA=" + module.git_blob_sha(path))
          print("EXPECTED_SHA=" + module.LEGACY_CHECKPOINT_BLOBS[rel])
          print("COMPAT=" + str(module.is_legacy_checkpoint_compatible(path)))
          PY

      - name: Validate immutable CI pins
        run: python scripts/validate_ci_pins.py

      - name: Run exact repository validation command
        run: python scripts/validate_continuity.py && python scripts/validate_coordination.py && python scripts/validate_lock_history.py && python scripts/validate_goal_graph.py && python scripts/evaluate_resume_reconciliation.py && python scripts/evaluate_work_fence.py --validate-policy && python scripts/evaluate_thread_lifecycle.py --validate-policy && python continuity/tools/validate_checkpoints.py && python continuity/tests/test_checkpoints.py && python scripts/select_work.py --validate-policy && python scripts/evaluate_selected_operation_execution.py --validate-contract && python scripts/evaluate_live_audit.py --validate-policy && python scripts/validate_research_policy.py && python scripts/validate_issue_lifecycle.py --validate-policy && python scripts/evaluate_user_observation.py && python scripts/validate_root_cause_repair.py && python scripts/validate_watchdog.py && python scripts/validate_reliability.py && python scripts/validate_semantic_firewall.py && python scripts/validate_semantic_firewall_control_paths.py && python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0

      - name: Start local Supabase database
        run: supabase db start

      - name: Run Supabase database tests
        run: supabase test db
