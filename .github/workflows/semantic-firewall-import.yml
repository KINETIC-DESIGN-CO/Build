name: semantic-firewall-import

on:
  push:
    branches:
      - work/1762b5f1-6b0d-4e45-9670-770b5409181c
    paths:
      - .github/workflows/semantic-firewall-import.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: work/1762b5f1-6b0d-4e45-9670-770b5409181c
      - name: Copy exact legacy Semantic Firewall corpus
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT='6cc602f2ac18599aa67c0352ce81fbd404dcb40f'
          BASELINE_COMMIT='c46179c730a5e7b94214433a59bdd3c85d18b31f'
          SOURCE_TREE='ca4b5d72897f17dc2f9d929186f41d6c93ba2dbc'
          rm -rf /tmp/life-semantic-firewall-source
          git clone --quiet https://github.com/Vinanonymous/life.git /tmp/life-semantic-firewall-source
          git -C /tmp/life-semantic-firewall-source checkout --quiet --detach "$SOURCE_COMMIT"
          test "$(git -C /tmp/life-semantic-firewall-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C /tmp/life-semantic-firewall-source cat-file -e "${BASELINE_COMMIT}^{commit}"
          test "$(git -C /tmp/life-semantic-firewall-source rev-parse "${SOURCE_COMMIT}:contracts/semantic-firewall")" = "$SOURCE_TREE"
          rm -rf contracts/semantic-firewall
          mkdir -p contracts
          cp -a /tmp/life-semantic-firewall-source/contracts/semantic-firewall contracts/
      - name: Verify exact copied blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object contracts/semantic-firewall/artifact-byte-identity.acceptance.json)" = 'f5af029e83b3ae115934cbc3684c59390252dd85'
          test "$(git hash-object contracts/semantic-firewall/contract-reference.acceptance.json)" = 'fe5bbb12f7365c5bf0405a0ee78397ab8b934654'
          test "$(git hash-object contracts/semantic-firewall/control-input-binding.acceptance.json)" = '8a74bfc60f2d62941e75ad33258069e3378865a1'
          test "$(git hash-object contracts/semantic-firewall/control-request.acceptance.json)" = 'adfbf6a823120990fd5782db3ac51ae62146f05b'
          test "$(git hash-object contracts/semantic-firewall/receipt-execution-binding.acceptance.json)" = 'e522a1f7ea72474204ad00ed384caadb6cc714d2'
          test "$(git hash-object contracts/semantic-firewall/receipt_execution_binding_inner.py)" = '771e97168051f0f19c3f384d72da8ed83d802aef'
          test "$(git hash-object contracts/semantic-firewall/run_artifact_byte_identity_acceptance.py)" = 'b1f4bfe92601cd78e59a851e20cd344a53bb9704'
          test "$(git hash-object contracts/semantic-firewall/run_contract_reference_acceptance.py)" = 'ad952e8aea4388a5782865735bf7630c136cffcd'
          test "$(git hash-object contracts/semantic-firewall/run_control_input_binding_acceptance.py)" = '44677fa47b344c3e6a018c4e4dc51daa5395de29'
          test "$(git hash-object contracts/semantic-firewall/run_control_request_acceptance.py)" = 'c40a0aebcaecc7aac671638c436f262b870788f4'
          test "$(git hash-object contracts/semantic-firewall/run_receipt_execution_binding_acceptance.py)" = '37ecc081c99f7145317dc6445eb4abf0fd303b83'
          test "$(git hash-object contracts/semantic-firewall/run_typed_contract_evaluation_acceptance.py)" = '8d1b80205a0a3fd9fede9d767eb3a6b54010950a'
          test "$(git hash-object contracts/semantic-firewall/typed-contract-evaluation.acceptance.json)" = 'fdef722d326e26582b731b804ce5ab9e4ab9d601'
      - name: Run exact legacy acceptance corpus
        shell: bash
        run: |
          set -euo pipefail
          python contracts/semantic-firewall/run_control_request_acceptance.py
          python contracts/semantic-firewall/run_contract_reference_acceptance.py
          python contracts/semantic-firewall/run_artifact_byte_identity_acceptance.py
          python contracts/semantic-firewall/run_control_input_binding_acceptance.py
          python contracts/semantic-firewall/run_receipt_execution_binding_acceptance.py
          python contracts/semantic-firewall/run_typed_contract_evaluation_acceptance.py
      - name: Commit permanent copied corpus and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/semantic-firewall-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import exact legacy Semantic Firewall corpus'
          git push origin HEAD:work/1762b5f1-6b0d-4e45-9670-770b5409181c
