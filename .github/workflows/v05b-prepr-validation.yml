name: V0.5B pre-PR validation

on:
  push:
    branches:
      - 'work/0b6a6127-5e73-4f2b-9d3e-53efb8a64411'

permissions:
  contents: read

jobs:
  validate_current_main_baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable current Build main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f563cbb9065673570f661546e464ea3adabc803b
          fetch-depth: 0

      - name: Prove immutable main checkout
        run: test "$(git rev-parse HEAD)" = "f563cbb9065673570f661546e464ea3adabc803b"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run exact current Build validation command
        run: python scripts/validate_continuity.py && python scripts/validate_coordination.py && python scripts/validate_lock_history.py && python scripts/validate_goal_graph.py && python scripts/evaluate_resume_reconciliation.py && python scripts/evaluate_work_fence.py --validate-policy && python scripts/evaluate_thread_lifecycle.py --validate-policy && python continuity/tools/validate_checkpoints.py && python continuity/tests/test_checkpoints.py && python scripts/select_work.py --validate-policy && python scripts/evaluate_selected_operation_execution.py --validate-contract && python scripts/evaluate_live_audit.py --validate-policy && python scripts/validate_research_policy.py && python scripts/validate_issue_lifecycle.py --validate-policy && python scripts/evaluate_user_observation.py && python scripts/validate_root_cause_repair.py && python scripts/validate_watchdog.py && python scripts/validate_reliability.py && python scripts/validate_semantic_firewall.py && python scripts/validate_semantic_firewall_control_paths.py && python -m unittest discover -s tests -p 'test_*.py'
