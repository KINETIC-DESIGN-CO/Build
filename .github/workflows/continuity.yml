name: continuity

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate immutable CI pins
        run: python scripts/validate_ci_pins.py
      - name: Validate continuity bundle
        run: python scripts/validate_continuity.py
      - name: Validate Reliability contracts
        run: python scripts/validate_reliability.py
      - name: Validate Semantic Firewall v1
        run: python scripts/validate_semantic_firewall.py
      - name: Validate work-fence policy
        run: python scripts/evaluate_work_fence.py --validate-policy
      - name: Validate source coordination
        run: python scripts/validate_coordination.py
      - name: Validate relevant lock history
        run: python scripts/validate_relevant_lock_history.py
      - name: Validate work-fence event
        run: python scripts/evaluate_work_fence.py --validate-current-event
      - name: Run repository tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: Start local Supabase database
        run: supabase db start
      - name: Run Supabase database tests
        run: supabase test db
