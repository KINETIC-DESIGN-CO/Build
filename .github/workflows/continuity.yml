name: continuity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate continuity bundle
        run: python scripts/validate_continuity.py
      - name: Validate source coordination
        run: python scripts/validate_coordination.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -p 'test_*.py'
