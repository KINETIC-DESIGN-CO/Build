name: fix-semantic-ledger-main-parity

on:
  push:
    branches:
      - work/0f68d6ae-75a0-4616-9814-819554f5f643

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/0f68d6ae-75a0-4616-9814-819554f5f643
          fetch-depth: 0
      - name: Restore canonical historical URL bytes and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('continuity/directive-ledger.jsonl')
          text = path.read_text()
          wrong = 'https://docs.github.com/en/repositories/configuring-branches-and-merges/in-your-repository/configuring-pull-request-merges/managing-a-merge-queue'
          right = 'https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue'
          count = text.count(wrong)
          if count != 2:
              raise SystemExit(f'expected exactly 2 historical URL differences, found {count}')
          path.write_text(text.replace(wrong, right))
          Path('.github/workflows/fix-semantic-ledger-main-parity.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add continuity/directive-ledger.jsonl .github/workflows/fix-semantic-ledger-main-parity.yml
          git diff --cached --check
          git commit -m 'Restore Semantic Firewall ledger main parity'
          git push origin HEAD:work/0f68d6ae-75a0-4616-9814-819554f5f643
